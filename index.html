function applyMove(b, m, color) {
  const nb = b.map(r=>[...r]);
  const piece = nb[m.fr][m.fc];
  const type = piece[1];

  let nep = null;
  const ncr = JSON.parse(JSON.stringify(castleRights));

  // ✅ FIXED: use ep parameter (NOT global enPassantTarget)
  if (type==='P' && m.tr===ep?.[0] && m.tc===ep?.[1]) {
    nb[m.fr][m.tc] = null;
  }

  if (type==='K' && Math.abs(m.tc-m.fc)===2) {
    if (m.tc===6) { nb[m.fr][5]=nb[m.fr][7]; nb[m.fr][7]=null; }
    else          { nb[m.fr][3]=nb[m.fr][0]; nb[m.fr][0]=null; }
  }

  if (type==='P' && Math.abs(m.tr-m.fr)===2)
    nep = [(m.fr+m.tr)/2, m.fc];

  nb[m.tr][m.tc] = m.promo ? (color+m.promo) : piece;
  nb[m.fr][m.fc] = null;

  return { nb, nep, ncr };
}
